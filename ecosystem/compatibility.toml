# Canonical compatibility manifest for the LazyBridge ecosystem.
#
# This file is the SINGLE source of truth for the supported combination.
# CI, documentation and requirements/verified.txt are generated from it
# (tools/render_compatibility.py); nothing else may hard-code a version
# or a Git ref.
#
# Distribution model: only LazyBridge lives on PyPI. Every other component
# installs from GitHub at the immutable ref recorded here (release tags
# once a repo publishes them, commit SHAs until then). Version ranges are
# only meaningful for PyPI packages — pip cannot resolve ranges across
# direct references — so [minimums] contains lazybridge alone.
#
# Promotion rule (stabilization plan §2.4): this file changes only via a
# dedicated PR opened AFTER a release's post-publish test succeeded; the
# ecosystem-released workflow green on that PR is what promotes the new
# combination.

schema_version = 1

[verified]
python = ["3.11", "3.12", "3.13"]
lazybridge = "1.0.1"

# Immutable GitHub refs of the verified, co-installable combination.
# ``extras`` are the extras exercised by the released-artifact CI.
[verified.github.lazytoolkit]
repo = "https://github.com/selvaz/LazyTools"
ref = "3845ad1e8c77b4822538db1266429e944fdd6d34"  # post-v0.3.2 main SHA (report figures / artifact refs, #61); tag at next release

[verified.github.lazypulse]
repo = "https://github.com/selvaz/LazyPulse"
ref = "v0.3.1"

[verified.github.lazycrawler]
repo = "https://github.com/selvaz/LazyCrawler"
ref = "54ecfbc3508ea168d45d52b50dbe9500adf1f2c1"  # post-v0.15.0 main SHA (get_artifacts content_hash filter, #36); tag at next release

[verified.github.market-data-hub]
repo = "https://github.com/selvaz/market-data-hub"
ref = "594928b8eb9aed52c5226b65d6a910c9dfd7a9f2"  # pre-tag pin (lazydatacore ArtifactRef contract, #43); finance train replaces with a release tag

[verified.github.lazystats]
repo = "https://github.com/selvaz/LazyStats"
ref = "dea66211c9ff617685daa1a69062ab61e395f16e"  # pre-tag pin (RegimeDB.get_plot, #7); finance train replaces with a release tag
extras = ["regimes"]

# Components excluded from the installable combination, with the reason.
# An exclusion here is a declared gap, not a silent one: the released CI
# does not install these, and the website must not present them as part
# of the verified stack.
[pending.lazyray]
repo = "https://github.com/selvaz/LazyRay"
reason = "LazyRay now pins the same market-data-hub revision as the verified combination (re-aligned, ECO-007), so the earlier pin conflict is gone. It stays pending only because the ecosystem-released CI does not yet install and smoke it; move it to [verified.github] once that job exercises it."

[minimums]
lazybridge = ">=1.0.1,<2.0"
