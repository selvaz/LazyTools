name: CodeMap Python adapter smoke (experimental)

on:
  pull_request:
    branches: [main]
    paths:
      - "src/lazytools/codemap/**"
      - "src/lazytools/maintenance/**"
      - "tests/test_maintenance.py"
      - "tests/test_maintenance_cli.py"
      - "tests/test_maintenance_verification.py"
      - "tests/test_codemap.py"
      - "docs/maintenance.md"
      - "examples/maintenance_two_repos.py"
      - "docs/codemap.md"
      - ".github/workflows/codemap-python-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-python:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python test environment
        run: python -m pip install 'lazybridge==1.8.9' pytest ruff mypy

      - name: Run isolated Python unit tests
        run: PYTHONPATH=src python -m pytest -q tests/test_codemap.py tests/test_maintenance.py tests/test_maintenance_cli.py tests/test_maintenance_verification.py

      - name: Ruff and mypy on experimental maintenance code
        run: |
          ruff check src/lazytools/codemap src/lazytools/maintenance tests/test_codemap.py tests/test_maintenance*.py examples/maintenance_two_repos.py
          mypy src/lazytools/codemap src/lazytools/maintenance

      - name: Install pinned local RepoMap engine
        run: |
          npm install --global '@sylphx/repomap@1.9.0'
          repomap version

      - name: Run real local-binary smoke test
        run: |
          PYTHONPATH=src python - <<'PY'
          import os
          from pathlib import Path
          from lazytools.codemap import RepoMapTools

          provider = RepoMapTools({"LazyTools": Path(os.environ["GITHUB_WORKSPACE"])}, use_embeddings=False)
          assert provider.backend.available(), "RepoMap executable is missing"
          tools = {tool.name: tool for tool in provider.as_tools()}
          overview = tools["codemap_overview"].run_sync(repo="LazyTools", tokens=900)
          assert overview.strip(), "empty overview"
          matches = tools["codemap_search"].run_sync(query="RegistryTools", repo="LazyTools", limit=5)
          assert "registry/tools.py" in matches, matches[:1000]
          detail = tools["codemap_context"].run_sync(target="RegistryTools", repo="LazyTools", code_lines=12)
          assert detail.strip(), "empty context"
          print("Live native Python smoke: overview, search, context passed")
          PY

      - name: Real Git commit refresh via LazyBridge Plan and RepoMap
        run: |
          PYTHONPATH=src python - <<'PY'
          import subprocess
          import tempfile
          from pathlib import Path
          import sys
          from lazytools.maintenance import CheckSpec, MaintenancePipeline, RepoSpec, Workspace
          from lazytools.maintenance.cli import main as maintenance_main

          def git(root, *args):
              return subprocess.check_output(["git", "-C", str(root), *args], text=True).strip()

          with tempfile.TemporaryDirectory() as directory:
              root = Path(directory) / "example"
              root.mkdir()
              git(root, "init", "-q")
              git(root, "config", "user.name", "CI")
              git(root, "config", "user.email", "ci@example.test")
              (root / "example.py").write_text("def old_api():\n    return 1\n")
              git(root, "add", "example.py")
              git(root, "commit", "-qm", "first")
              first_sha = git(root, "rev-parse", "HEAD")
              pipeline = MaintenancePipeline(
                  Workspace((RepoSpec("example", root),), Path(directory) / "state"),
                  use_embeddings=False,
              )
              first = pipeline.execute()
              assert first["verified"] is False
              assert first["snapshots"]["example"]["cache_hit"] is False
              second = pipeline.execute()
              assert second["snapshots"]["example"]["cache_hit"] is True
              (root / "example.py").write_text("def new_api():\n    return 2\n")
              git(root, "add", "example.py")
              git(root, "commit", "-qm", "second")
              third = pipeline.execute(base_refs={"example": first_sha})
              assert third["snapshots"]["example"]["cache_hit"] is False
              assert third["sha"]["example"] != first_sha
              assert third["changes"]["example"] == [{"status": "M", "path": "example.py"}]
              assert third["verification"]["status"] == "not_run"
              approved = MaintenancePipeline(
                  Workspace((RepoSpec("example", root),), Path(directory) / "state"),
                  checks=(CheckSpec(
                      "python_smoke", "example",
                      (sys.executable, "-c", "from pathlib import Path;assert Path('example.py').is_file()"),
                  ),),
                  use_embeddings=False,
              ).execute(base_refs={"example": first_sha})
              assert approved["verification"]["status"] == "passed_selected_checks"
              assert approved["verified"] is False
              assert git(root, "status", "--porcelain") == ""
              manifest = Path(directory) / "maintenance.toml"
              manifest.write_text(
                  'schema_version = 1\nstate_dir = "state"\n'
                  '[[repos]]\nid = "example"\nroot = "example"\n'
              )
              assert maintenance_main(["--config", str(manifest), "--validate-only"]) == 0
              assert maintenance_main(["--config", str(manifest), "--json"]) == 0
              print("Real Plan + RepoMap: cold index, SHA refresh, approved check and CLI passed")
          PY

      - name: Public two-repository maintenance demo
        run: PYTHONPATH=src python examples/maintenance_two_repos.py
