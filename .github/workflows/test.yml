name: test

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        env:
          # LazyFin is the one private sibling gating the portfolio-optimizer
          # connector tests (tests/test_portfolio_optimization_tools.py does
          # pytest.importorskip("lazyfin")). Without ECOSYSTEM_PAT those tests
          # silently skip rather than fail — install it here, same PAT/pattern
          # ecosystem-source-head.yml already uses, so this job actually runs
          # them instead of a green check that never executed the assertions.
          ECOSYSTEM_PAT: ${{ secrets.ECOSYSTEM_PAT }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          if [ -n "$ECOSYSTEM_PAT" ]; then
            pip install "lazyfin[optimizer] @ git+https://x-access-token:${ECOSYSTEM_PAT}@github.com/selvaz/LazyFin.git@main"
          else
            echo "::notice::ECOSYSTEM_PAT not set: portfolio-optimizer connector tests will skip"
          fi
      - name: Pytest
        # Coverage gate. The floor (70%) sits a few points below the
        # measured ``[test]``-only coverage (~74%) so it catches a real
        # regression without flapping on the extras-skipped tests or
        # minor variance across the Python matrix.
        run: pytest -q --cov=lazytools --cov-report=term-missing --cov-fail-under=70

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/lazytools
