name: test

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Pytest
        # Coverage gate. The floor (70%) sits a few points below the
        # measured ``[test]``-only coverage (~74%) so it catches a real
        # regression without flapping on the extras-skipped tests or
        # minor variance across the Python matrix.
        run: pytest -q --cov=lazytools --cov-report=term-missing --cov-fail-under=70

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Ruff
        run: ruff check src tests
      - name: Mypy
        run: mypy src/lazytools
