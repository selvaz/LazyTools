# Claude Code delegation ladders, ordered by capability. Fable is explicit-only.
# Tier pairs (owner 31/10/2026): Haiku/Luna, Sonnet/Terra 6.1, Opus/Sol 6.1, Fable/Astra.
# Astra pairs only with Fable, which is explicit-only, so no automatic rung uses it.
[basic]
[[basic.steps]]
[basic.steps.providers.codex]
model = "gpt-6-luna"
effort = "medium"
[basic.steps.providers.claude_code]
model = "claude-haiku-5-5"
effort = "medium"

[writing]
[[writing.steps]]
[writing.steps.providers.codex]
model = "gpt-6.1-terra"
effort = "high"
[writing.steps.providers.claude_code]
model = "claude-sonnet-5-5"
effort = "high"
[[writing.steps]]
[writing.steps.providers.codex]
model = "gpt-6.1-sol"
effort = "xhigh"
[writing.steps.providers.claude_code]
model = "claude-opus-5-5"
effort = "high"

[thinking]
[[thinking.steps]]
[thinking.steps.providers.codex]
model = "gpt-6.1-sol"
effort = "xhigh"
[thinking.steps.providers.claude_code]
model = "claude-opus-5-5"
effort = "medium"
[[thinking.steps]]
[thinking.steps.providers.claude_code]
model = "claude-opus-5-5"
effort = "high"

[critical]
[[critical.steps]]
[critical.steps.providers.claude_code]
model = "claude-opus-5-5"
effort = "high"
[critical.steps.providers.codex]
model = "gpt-6.1-sol"
effort = "high"
[[critical.steps]]
[critical.steps.providers.claude_code]
model = "claude-opus-5-5"
effort = "max"
[critical.steps.providers.codex]
model = "gpt-6.1-sol"
effort = "xhigh"
