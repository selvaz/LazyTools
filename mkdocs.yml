site_name: LazyTools
site_description: Reusable tool providers, connector clients, and safety wrappers for LazyBridge agents.
site_url: https://tools.lazybridge.com/
repo_url: https://github.com/selvaz/LazyTools
repo_name: selvaz/LazyTools
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 LazyTools — Apache-2.0

docs_dir: docs
strict: true

theme:
  name: material
  custom_dir: overrides
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            show_root_heading: true
            show_root_toc_entry: false
            heading_level: 3
            docstring_style: google
            merge_init_into_class: true
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Overview:
          - index.md
        Tools:
          - connectors.md
          - gmail.md
          - telegram.md
          - mcp.md
          - code-support/index.md
          - code-support/claude-code.md
          - code-support/codex.md
          - code-support/collaboration.md
          - gateway.md
          - documents.md
          - skills.md
        Core tools:
          - core-tools.md
          - planners/index.md
          - planners/dag-builder.md
          - planners/blackboard.md
          - composition/index.md
          - composition/chain.md
          - composition/parallel.md
          - hil/index.md
          - hil/human.md
          - hil/supervisor.md
        Safety:
          - safety.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/selvaz/LazyTools
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/lazytoolkit/
    - icon: fontawesome/solid/envelope
      link: mailto:LazyBridgeLabs@gmail.com
      name: Email LazyBridge Labs

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Tools:
      - Overview: connectors.md
      - Gmail: gmail.md
      - Telegram: telegram.md
      - MCP: mcp.md
      - Code Support Agent:
          - Overview: code-support/index.md
          - Claude Code: code-support/claude-code.md
          - Codex: code-support/codex.md
          - Collaboration: code-support/collaboration.md
      - External tool gateway: gateway.md
      - Documents: documents.md
      - Skills: skills.md
  - Core tools:
      - Overview: core-tools.md
      - Planners:
          - planners/index.md
          - DAG builder: planners/dag-builder.md
          - Blackboard: planners/blackboard.md
      - Composition sugar:
          - composition/index.md
          - Chain: composition/chain.md
          - Parallel: composition/parallel.md
      - Human-in-the-loop:
          - hil/index.md
          - Human approval: hil/human.md
          - Supervisor REPL: hil/supervisor.md
  - Safety: safety.md
  - Reference: reference.md
  - Ecosystem:
      - lazybridge.com: https://lazybridge.com/
      - Core docs: https://core.lazybridge.com/
      - LazyPulse: https://pulse.lazybridge.com/
