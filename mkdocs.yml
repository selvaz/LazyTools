site_name: LazyTools
site_description: Reusable tool providers, connector clients, and safety wrappers for LazyBridge agents.
site_url: https://tools.lazybridge.com/
repo_url: https://github.com/selvaz/LazyTools
repo_name: selvaz/LazyTools
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 LazyTools — Apache-2.0

docs_dir: docs
strict: true

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            show_root_heading: true
            show_root_toc_entry: false
            heading_level: 3
            docstring_style: google
            merge_init_into_class: true
  - llmstxt:
      full_output: llms-full.txt
      sections:
        Overview:
          - index.md
        Guides:
          - connectors.md
          - mcp.md
          - gateway.md
          - safety.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - Connectors: connectors.md
  - MCP: mcp.md
  - External tool gateway: gateway.md
  - Safety: safety.md
  - Reference: reference.md
