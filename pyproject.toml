[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lazytoolkit"
version = "0.7.0"
description = "Reusable tool providers, connector clients, and safety wrappers for LazyBridge and LazyPulse agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "selvaz" }]
keywords = ["llm", "agents", "tools", "gmail", "telegram", "mcp", "lazybridge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["lazybridge>=1.0.1,<2.0"]

[project.optional-dependencies]
gmail      = ["google-api-python-client>=2.0,<3.0", "google-auth>=2.0,<3.0", "google-auth-oauthlib>=1.0,<2.0"]
# Local Outlook desktop connector (COM/MAPI). pywin32 is Windows-only, so the
# marker keeps `pip install "lazytoolkit[outlook] @ git+https://github.com/selvaz/LazyTools.git"` a no-op-ish success on other
# platforms (the connector imports without it; only OutlookClient.connect needs it).
outlook    = ["pywin32>=306; sys_platform == 'win32'"]
telegram   = ["httpx>=0.27,<1.0"]
mcp        = ["mcp>=1.0,<2.0"]
docs       = ["pypdf>=3.0,<7.0", "python-docx>=1.0,<2.0", "trafilatura>=1.6,<3.0"]
edgar      = ["httpx>=0.27,<1.0"]
marketdata = ["httpx>=0.27,<1.0"]
# Report figure charts (report/charts.py): matplotlib only — the series data
# comes from market-data-hub, which stays git-installed with no extra (below).
charts     = ["matplotlib>=3.8,<4.0"]
# The market-data-hub connector has NO extra: market-data-hub is a private,
# git-installed package (pip install 'market-data-hub @ git+https://github.com/
# selvaz/market-data-hub.git'), so a bare PyPI name here could never resolve
# and would be a dependency-confusion exposure. The connector imports lazily
# and raises a clear ImportError with the install hint when MDH is absent.
# LazyCrawler surfaced as an LLM tool interface only (thin pass-through).
# LazyCrawler is NOT on PyPI (the bare name is unregistered — a bare
# ``lazycrawler>=0.14`` requirement could never resolve and is a
# dependency-confusion exposure, same as market-data-hub above). Pinned to
# the immutable release tag; the ref is governed by
# ecosystem/compatibility.toml.
web        = ["lazycrawler @ git+https://github.com/selvaz/LazyCrawler.git@v0.19.0"]
# ``mcp`` is included so the real-SDK integration tests (loop-affinity
# regression coverage) run in CI instead of silently skipping.
test       = ["pytest>=7.0", "pytest-asyncio>=0.23", "pytest-cov>=4.0", "httpx>=0.27,<1.0", "mcp>=1.0,<2.0", "ruff>=0.6", "mypy>=1.10"]
# Documentation-site build (mkdocs). Named ``site`` to avoid clashing with the
# document-reading ``docs`` extra above.
site       = ["mkdocs-material>=9.5,<10.0", "mkdocstrings[python]>=0.24,<1.0", "mkdocs-llmstxt>=0.3,<1.0", "pymdown-extensions>=10.0,<11.0"]

[project.scripts]
# MCP server entry point — mirror of the MCP client connector. Requires the
# ``mcp`` extra (pip install "lazytoolkit[mcp] @ git+https://github.com/selvaz/LazyTools.git"); the command errors with a
# clear install hint if the SDK is absent.
lazytools-mcp = "lazytools.mcp_server.__main__:main"

[project.urls]
Homepage = "https://github.com/selvaz/LazyTools"
Repository = "https://github.com/selvaz/LazyTools"
Documentation = "https://tools.lazybridge.com"

# Direct references are part of the distribution model: only LazyBridge lives
# on PyPI; every other ecosystem component is installed from GitHub at an
# immutable ref (see ecosystem/compatibility.toml).
[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/lazytools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Without this, `lazytools` resolves through whatever editable install the
# machine carries, which can be a different checkout entirely: a suite run in
# this tree then answers for code that is not in it. Found on 15 August, when
# tests in a worktree loaded the canonical checkout and reported failures that
# belonged to neither tree.
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E402",
    "E501",
    "B008",
    "RUF012",
    "SIM105",
    "SIM108",  # ternary vs if-else — readability
    "RUF002",
    "RUF022",
]

[tool.ruff.lint.isort]
known-first-party = ["lazytools"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
